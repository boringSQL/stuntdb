name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  live:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: "16"
            client: "18"
          - server: "17"
            client: "18"
          - server: "18"
            client: "18"
          - server: "19"
            client: "19"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: boringsql/regresql
          path: regresql
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18 postgresql-client-19
          echo "/usr/lib/postgresql/${{ matrix.client }}/bin" >> "$GITHUB_PATH"
      - name: start a server
        run: |
          docker build -q -t stuntdb-lab -f testdata/lab/Dockerfile \
            --build-arg PG_MAJOR=${{ matrix.server }} regresql/
          docker run -d --name lab -e POSTGRES_PASSWORD=lab -p 5432:5432 stuntdb-lab
          for i in $(seq 1 60); do
            docker exec lab psql -U postgres -qc 'select 1' >/dev/null 2>&1 && break
            sleep 1
          done
          # the image restarts its server after initdb
          sleep 2
          docker exec lab psql -U postgres -qc 'select 1'
      - run: go test ./... -count=1
        env:
          STUNTDB_TEST_PGURI: postgres://postgres:lab@localhost:5432/postgres
