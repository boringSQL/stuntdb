name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  live:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17", "18", "19"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: boringsql/regresql
          path: regresql
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: start a server
        run: |
          docker build -q -t stuntdb-lab -f testdata/lab/Dockerfile \
            --build-arg PG_MAJOR=${{ matrix.postgres }} regresql/
          docker run -d --name lab -e POSTGRES_PASSWORD=lab -p 5432:5432 stuntdb-lab
          for i in $(seq 1 60); do
            docker exec lab psql -U postgres -qc 'select 1' >/dev/null 2>&1 && break
            sleep 1
          done
          # the image runs a temporary server during initdb, then restarts
          sleep 2
          docker exec lab psql -U postgres -qc 'select 1'
      - run: go test ./... -count=1
        env:
          STUNTDB_TEST_PGURI: postgres://postgres:lab@localhost:5432/postgres
